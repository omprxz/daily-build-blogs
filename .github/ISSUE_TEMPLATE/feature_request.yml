name: Feature Request
description: Suggest an idea or enhancement for Daily Build Blogs
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting a feature! Please provide context on the problem this solves and how you envision the feature working.
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem? Please describe clearly.
      placeholder: "I'm always frustrated when..."
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the solution you'd like to see implemented.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you have considered.
  - type: dropdown
    id: category
    attributes:
      label: Feature Category
      options:
        - AI Model Integration
        - Editorial Studio & CMS
        - Automation & Workflows
        - SEO & Analytics
        - Image Processing & Media
        - Performance & SSR
        - Deployment & Infrastructure
    validations:
      required: true
