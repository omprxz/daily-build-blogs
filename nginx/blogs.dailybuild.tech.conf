# ==============================================================================
# Nginx Virtual Host Configuration for blogs.dailybuild.tech
# Dedicated Reverse Proxy for DailyBuild Tech (Preserves existing VPS services)
# Application Port: 127.0.0.1:4000
# ==============================================================================

# HTTP -> HTTPS Redirect
server {
    listen 80;
    listen [::]:80;
    server_name blogs.dailybuild.tech;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Production HTTPS Server
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name blogs.dailybuild.tech;

    # SSL Certificates (managed via Certbot ACME)
    ssl_certificate /etc/letsencrypt/live/blogs.dailybuild.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/blogs.dailybuild.tech/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Max upload limit for media assets
    client_max_body_size 25M;

    # Static assets caching
    location /assets/ {
        proxy_pass http://127.0.0.1:4000/assets/;
        proxy_cache_valid 200 30d;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /uploads/ {
        proxy_pass http://127.0.0.1:4000/uploads/;
        proxy_cache_valid 200 7d;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Reverse Proxy to Express.js (SSR + APIs)
    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        proxy_read_timeout 90;
    }
}
